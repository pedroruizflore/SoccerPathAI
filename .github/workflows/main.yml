name: SoccerPath AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: soccer_db
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn google-generativeai psycopg2-binary pytest httpx
        
    # --- CRITICAL STEP: Creating the table in the GitHub Environment ---
    - name: Setup Database Table
      run: |
        PGPASSWORD=password psql -h localhost -U postgres -d soccer_db -c "CREATE TABLE IF NOT EXISTS match_stats (id SERIAL PRIMARY KEY, athlete_id INT, goals INT, assists INT, interceptions INT, match_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"

    - name: Run Tests
      env:
        DB_HOST: localhost
        DB_NAME: soccer_db
        DB_USER: postgres
        DB_PASS: password
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # O GitHub puxa do segredo que você criou
      run: |
        pytest